name: Refresh contribution graph

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/contribution-graph.mjs
      - .github/workflows/contributions.yml

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render SVGs
        run: node scripts/contribution-graph.mjs filip-jovanov-h4h

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Refresh contribution graph"
          git push
